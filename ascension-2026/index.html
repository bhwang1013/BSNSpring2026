<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascension 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="hero-label">THE YEAR OF</p>
      <h1 class="hero-title">ASCENSION<span class="hero-year">2026</span></h1>
      <p class="hero-sub">Money · Muscle · Mindset · Dating</p>
    </div>
    <div class="hero-line"></div>
  </header>

  <nav class="month-nav" id="monthNav">
    <div class="month-nav-inner">
      <button class="month-btn" data-month="0">APR</button>
      <button class="month-btn" data-month="1">MAY</button>
      <button class="month-btn" data-month="2">JUN</button>
      <button class="month-btn" data-month="3">JUL</button>
      <button class="month-btn" data-month="4">AUG</button>
      <button class="month-btn" data-month="5">SEP</button>
      <button class="month-btn" data-month="6">OCT</button>
      <button class="month-btn" data-month="7">NOV</button>
      <button class="month-btn" data-month="8">DEC</button>
    </div>
  </nav>

  <main class="main" id="mainContent">
    <!-- JS renders content here -->
  </main>

  <footer class="footer">
    <p>Build. Grind. Ascend. &mdash; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
